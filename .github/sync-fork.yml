name: Synchronisation automatique avec Martine

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer mon fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Synchroniser avec le depot de Martine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/MarteOued/Projet-series-temporelles.git
          git fetch upstream main

          git checkout main
          git merge --no-edit upstream/main
          git push origin main
